# Defence Brats Social Network - Docker Compose Configuration
# Production-ready setup with MongoDB, Redis, and application services
# Security-focused with proper networking and volume management

version: '3.8'

services:
  # ===================================
  # Application Services
  # ===================================

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: defence-brats-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URL=mongodb://mongodb:27017/defence-brats
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-your-super-secret-refresh-key}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - WS_PORT=${WS_PORT:-3001}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - defence-brats-network
    volumes:
      - app-uploads:/tmp/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # WebSocket Server for real-time features
  websocket:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: defence-brats-websocket
    restart: unless-stopped
    command: ["node", "websocket-server.js"]
    ports:
      - "${WS_PORT:-3001}:3001"
    environment:
      - NODE_ENV=production
      - WS_PORT=3001
      - MONGODB_URL=mongodb://mongodb:27017/defence-brats
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - defence-brats-network
    healthcheck:
      test: ["CMD", "node", "scripts/websocket-healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===================================
  # Database Services
  # ===================================

  mongodb:
    image: mongo:7.0
    container_name: defence-brats-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-securepassword123}
      - MONGO_INITDB_DATABASE=defence-brats
    volumes:
      - mongodb-data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - defence-brats-network
    command: mongod --auth --bind_ip_all
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  redis:
    image: redis:7.2-alpine
    container_name: defence-brats-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-securepassword123}
    volumes:
      - redis-data:/data
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - defence-brats-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ===================================
  # Development Services (Optional)
  # ===================================

  # MongoDB Express (Development UI)
  mongo-express:
    image: mongo-express:latest
    container_name: defence-brats-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=${MONGO_ROOT_USERNAME:-admin}
      - ME_CONFIG_MONGODB_ADMINPASSWORD=${MONGO_ROOT_PASSWORD:-securepassword123}
      - ME_CONFIG_MONGODB_URL=mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-securepassword123}@mongodb:27017/
      - ME_CONFIG_BASICAUTH_USERNAME=${MONGO_UI_USER:-admin}
      - ME_CONFIG_BASICAUTH_PASSWORD=${MONGO_UI_PASSWORD:-password123}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - defence-brats-network
    profiles:
      - development

  # Redis Commander (Development UI)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: defence-brats-redis-commander
    restart: unless-stopped
    ports:
      - "8082:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379:0:${REDIS_PASSWORD:-securepassword123}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - defence-brats-network
    profiles:
      - development

  # ===================================
  # Reverse Proxy & Load Balancer
  # ===================================

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: defence-brats-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/ssl:/etc/nginx/ssl:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - app
      - websocket
    networks:
      - defence-brats-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - production

# ===================================
# Networks
# ===================================
networks:
  defence-brats-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ===================================
# Volumes
# ===================================
volumes:
  # Database volumes
  mongodb-data:
    driver: local
  redis-data:
    driver: local

  # Application volumes
  app-uploads:
    driver: local
  nginx-logs:
    driver: local

# ===================================
# Secrets (for production)
# ===================================
secrets:
  mongodb_password:
    external: true
  redis_password:
    external: true
  jwt_secret:
    external: true